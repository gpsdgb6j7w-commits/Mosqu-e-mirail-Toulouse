<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gran Mezquita del Mirail — Toulouse</title>
  
  <!-- PWA & App Nativa iOS / Android -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mezquita Mirail" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#064e3b" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #faf8f5;
      color: #1c1917;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
    }
    .font-arabic {
      font-family: 'Amiri', serif;
    }
    .islamic-pattern {
      background-color: #064e3b;
      background-image: radial-gradient(rgba(217, 119, 6, 0.16) 1px, transparent 1px),
                        radial-gradient(rgba(217, 119, 6, 0.16) 1px, #064e3b 1px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 50%, #b45309 100%);
    }
  </style>
</head>
<body class="antialiased selection:bg-emerald-800 selection:text-white min-h-screen flex flex-col justify-between">

  <!-- Header / Banner Superior -->
  <header class="islamic-pattern text-white shadow-lg">
    <div class="max-w-md mx-auto px-4 py-6 text-center">
      <span class="text-xs uppercase tracking-widest text-amber-300 font-semibold">Toulouse, Francia</span>
      <h1 class="text-2xl font-bold mt-1 font-arabic">جامع الميراي</h1>
      <h2 class="text-lg font-semibold tracking-wide">Gran Mezquita del Mirail</h2>
      <p class="text-xs text-emerald-100 mt-2">Bienvenido a la aplicación oficial de la comunidad</p>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-md mx-auto px-4 py-6 w-full space-y-4">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200 text-center">
      <div class="w-12 h-12 bg-emerald-50 text-emerald-800 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">🕌</div>
      <h3 class="font-bold text-stone-800 text-lg">App en funcionamiento</h3>
      <p class="text-sm text-stone-600 mt-1">La aplicación de la mezquita se ha cargado correctamente en GitHub Pages.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text-xs text-stone-500">
    &copy; 2026 Gran Mezquita del Mirail — Toulouse
  </footer>

</body>
</html>
